sonar.projectKey=nextjs-devsecops
sonar.projectName=NextJS DevSecOps

# REPLACE with your actual SonarCloud organization key (found in
# SonarCloud → your org → Administration → Organization key).
sonar.organization=yajat15

sonar.sources=.
sonar.sourceEncoding=UTF-8
sonar.exclusions=node_modules/**,.next/**

# sonar.language=js was removed — it's a deprecated property. Modern
# SonarCloud auto-detects language per file extension; forcing a single
# language can cause files to be silently skipped.

sonar.javascript.lcov.reportPaths=coverage/lcov.info
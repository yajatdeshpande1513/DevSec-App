name: DevSecOps Security Gatekeeper

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ***REMOVED***
      SNYK_TOKEN: ***REMOVED***
      VERCEL_TOKEN: ***REMOVED***

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 🔐 GITLEAKS – Secrets Detection
    - name: Gitleaks Scan
      uses: gitleaks/gitleaks-action@v2
      with:
        fail: true

    # 🧠 SONARQUBE – SAST
    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v2
      with:
        args: >
          -Dsonar.projectKey=nextjs-devsecops
          -Dsonar.sources=.
      env:
        SONAR_TOKEN: ***REMOVED***
        SONAR_HOST_URL: https://sonarcloud.io

    # 📦 SNYK – Dependency Vulnerabilities
    - name: Snyk Dependency Scan
      uses: snyk/actions/node@master
      with:
        command: test
      env:
        SNYK_TOKEN: ***REMOVED***

    # 🐳 BUILD DOCKER IMAGE
    - name: Docker Build
      run: docker build -t nextjs-secure .

    # 🔍 TRIVY – Container Vulnerability Scan
    - name: Trivy Scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: nextjs-secure
        severity: CRITICAL,HIGH
        exit-code: 1

    # 🏗️ TERRAFORM INIT
    - name: Terraform Init
      run: |
        cd terraform
        terraform init

    # 🔐 CHECKOV – IaC Security
    - name: Checkov Scan
      uses: bridgecrewio/checkov-action@master
      with:
        directory: terraform
        framework: terraform
        soft_fail: false

    # 🚀 DEPLOY – ONLY IF ALL ABOVE PASSED
    - name: Deploy to Vercel
      if: success()
      run: |
        npm install -g vercel
        vercel pull --yes --environment=production --token=$VERCEL_TOKEN
        vercel build --prod --token=$VERCEL_TOKEN
        vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

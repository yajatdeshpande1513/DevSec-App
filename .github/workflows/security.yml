name: DevSecOps Security Gatekeeper

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Prepare Telemetry Script
      run: |
        cat << 'EOF' > report.sh
        #!/bin/bash
        curl -sS -X POST $WEBHOOK_URL \
        -H "Content-Type: application/json" \
        -H "x-webhook-secret: $REPORT_WEBHOOK_SECRET" \
        -d "{
          \"status\": \"$1\",
          \"message\": \"$2\",
          \"timestamp\": \"$(date -u +\"%Y-%m-%dT%H:%M:%SZ\")\",
          \"gates\": {
            \"gitleaks\": \"$3\",
            \"sonarqube\": \"$4\",
            \"snyk\": \"$5\",
            \"trivy\": \"$6\",
            \"checkov\": \"$7\"
          }
        }"
        EOF
        chmod +x report.sh

    - name: Report Start
      env:
        REPORT_WEBHOOK_SECRET: ${{ secrets.REPORT_WEBHOOK_SECRET }}
        WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      run: ./report.sh "scanning" "Pipeline started. Initializing Gitleaks..." "scanning" "pending" "pending" "pending" "pending"

    - name: Gitleaks Scan
      id: gitleaks
      continue-on-error: true
      run: |
        docker run --rm -v ${{ github.workspace }}:/repo zricethezav/gitleaks:latest detect --source=/repo --no-git -v

    - name: Report Post-Gitleaks
      if: always()
      env:
        REPORT_WEBHOOK_SECRET: ${{ secrets.REPORT_WEBHOOK_SECRET }}
        WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      run: ./report.sh "scanning" "Gitleaks complete. Initializing SonarQube..." "${{ steps.gitleaks.outcome }}" "scanning" "pending" "pending" "pending"

    - name: SonarQube Scan
      id: sonar
      uses: SonarSource/sonarqube-scan-action@v2
      continue-on-error: true
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: https://sonarcloud.io

    - name: Report Post-SonarQube
      if: always()
      env:
        REPORT_WEBHOOK_SECRET: ${{ secrets.REPORT_WEBHOOK_SECRET }}
        WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      run: ./report.sh "scanning" "SonarQube complete. Initializing Snyk..." "${{ steps.gitleaks.outcome }}" "${{ steps.sonar.outcome }}" "scanning" "pending" "pending"

    - name: Snyk Dependency Scan
      id: snyk
      uses: snyk/actions/node@master
      continue-on-error: true
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        command: test

    - name: Docker Build
      id: docker_build
      run: docker build -t nextjs-secure .
      continue-on-error: true

    - name: Report Post-Snyk
      if: always()
      env:
        REPORT_WEBHOOK_SECRET: ${{ secrets.REPORT_WEBHOOK_SECRET }}
        WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      run: ./report.sh "scanning" "Snyk complete. Initializing Trivy..." "${{ steps.gitleaks.outcome }}" "${{ steps.sonar.outcome }}" "${{ steps.snyk.outcome }}" "scanning" "pending"

    - name: Trivy Container Scan
      id: trivy
      if: steps.docker_build.outcome == 'success'
      uses: aquasecurity/trivy-action@master
      continue-on-error: true
      with:
        image-ref: nextjs-secure
        severity: CRITICAL
        exit-code: 1

    - name: Report Post-Trivy
      if: always()
      env:
        REPORT_WEBHOOK_SECRET: ${{ secrets.REPORT_WEBHOOK_SECRET }}
        WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      run: ./report.sh "scanning" "Trivy complete. Initializing Checkov..." "${{ steps.gitleaks.outcome }}" "${{ steps.sonar.outcome }}" "${{ steps.snyk.outcome }}" "${{ steps.trivy.outcome || 'skipped' }}" "scanning"

    - name: Terraform Init
      id: tf_init
      run: |
        cd terraform
        terraform init -backend=false
      continue-on-error: true

    - name: Checkov Scan (IaC)
      id: checkov
      uses: bridgecrewio/checkov-action@master
      continue-on-error: true
      with:
        directory: terraform
        framework: terraform
        soft_fail: false

    - name: Determine Overall Status
      id: overall
      if: always()
      run: |
        if [ "${{ steps.gitleaks.outcome }}" = "failure" ] || \
           [ "${{ steps.sonar.outcome }}" = "failure" ] || \
           [ "${{ steps.snyk.outcome }}" = "failure" ] || \
           [ "${{ steps.docker_build.outcome }}" = "failure" ] || \
           [ "${{ steps.trivy.outcome }}" = "failure" ] || \
           [ "${{ steps.checkov.outcome }}" = "failure" ]; then
          echo "status=vulnerable" >> $GITHUB_OUTPUT
        else
          echo "status=secure" >> $GITHUB_OUTPUT
        fi

    - name: Deploy to Vercel
      id: deploy
      if: steps.overall.outputs.status == 'secure'
      continue-on-error: true
      run: |
        npm install -g vercel
        vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

    - name: Report Final Status
      if: always()
      env:
        REPORT_WEBHOOK_SECRET: ${{ secrets.REPORT_WEBHOOK_SECRET }}
        WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      run: |
        DEPLOY_OUTCOME="${{ steps.deploy.outcome || 'skipped' }}"
        ./report.sh "${{ steps.overall.outputs.status }}" "Pipeline completed (deploy: $DEPLOY_OUTCOME)" "${{ steps.gitleaks.outcome }}" "${{ steps.sonar.outcome }}" "${{ steps.snyk.outcome }}" "${{ steps.trivy.outcome || 'skipped' }}" "${{ steps.checkov.outcome }}"
name: DevSecOps Security Gatekeeper

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Gitleaks Scan
      uses: gitleaks/gitleaks-action@v2
      with:
        fail: true

    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v2
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: https://sonarcloud.io

    - name: Snyk Dependency Scan
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        command: test

    - name: Docker Build
      run: docker build -t nextjs-secure .

    - name: Trivy Container Scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: nextjs-secure
        severity: CRITICAL
        exit-code: 1

    - name: Terraform Init & Checkov
      run: |
        cd terraform
        terraform init -backend=false
    
    - name: Checkov Scan (IaC)
      uses: bridgecrewio/checkov-action@master
      with:
        directory: terraform
        framework: terraform
        soft_fail: true

    - name: Deploy to Vercel
      if: success()
      run: |
        npm install -g vercel
        vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

    - name: Report Security Failure
      if: failure()
      run: |
        curl -X POST https://dev-sec-app-8l55.vercel.app/api/security-report \
        -H "Content-Type: application/json" \
        -d '{
          "status": "vulnerable",
          "message": "Gatekeeper Alert: Security violation detected. Pipeline locked.",
          "timestamp": "'$(date)'"
        }'
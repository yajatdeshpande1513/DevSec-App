name: DevSecOps Security Gatekeeper

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Prepare Telemetry Script
      run: |
        cat << 'EOF' > report.sh
        #!/bin/bash
        # Builds the JSON payload with jq instead of string interpolation so a
        # stray quote/backslash in any argument can never produce broken JSON.
        jq -n \
          --arg status "$1" \
          --arg message "$2" \
          --arg gitleaks "$3" \
          --arg sonarqube "$4" \
          --arg snyk "$5" \
          --arg trivy "$6" \
          --arg checkov "$7" \
          '{
            status: $status,
            message: $message,
            timestamp: (now | todate),
            gates: {
              gitleaks: $gitleaks,
              sonarqube: $sonarqube,
              snyk: $snyk,
              trivy: $trivy,
              checkov: $checkov
            }
          }' | curl -sS -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "x-webhook-secret: $REPORT_WEBHOOK_SECRET" \
            -d @-
        EOF
        chmod +x report.sh

    - name: Report Start
      env:
        REPORT_WEBHOOK_SECRET: ${{ secrets.REPORT_WEBHOOK_SECRET }}
        WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      run: ./report.sh "scanning" "Pipeline started. Initializing Gitleaks..." "scanning" "pending" "pending" "pending" "pending"

    - name: Gitleaks Scan
      id: gitleaks
      continue-on-error: true
      run: |
        # NOTE: --no-git was removed. It was making this scan blind to commit
        # history, which is exactly where the previously-leaked tokens live.
        # This will (correctly) FAIL until Phase 0 history purge is done.
        docker run --rm -v ${{ github.workspace }}:/repo zricethezav/gitleaks:v8.21.2 detect --source=/repo -v

    - name: Report Post-Gitleaks
      if: always()
      env:
        REPORT_WEBHOOK_SECRET: ${{ secrets.REPORT_WEBHOOK_SECRET }}
        WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      run: ./report.sh "scanning" "Gitleaks complete. Initializing SonarQube..." "${{ steps.gitleaks.outcome }}" "scanning" "pending" "pending" "pending"

    - name: ESLint (incl. eslint-plugin-security rules)
      id: eslint
      run: npm ci && npm run lint
      continue-on-error: true

    - name: SonarCloud Scan
      id: sonarqube_scan
      uses: SonarSource/sonarqube-scan-action@v8.2.0
      continue-on-error: true
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    - name: Determine SAST Outcome
      id: sonar
      if: always()
      run: |
        if [ "${{ steps.eslint.outcome }}" = "failure" ] || \
           [ "${{ steps.sonarqube_scan.outcome }}" = "failure" ]; then
          echo "outcome=failure" >> $GITHUB_OUTPUT
        else
          echo "outcome=success" >> $GITHUB_OUTPUT
        fi

    - name: Report Post-SonarQube
      if: always()
      env:
        REPORT_WEBHOOK_SECRET: ${{ secrets.REPORT_WEBHOOK_SECRET }}
        WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      run: ./report.sh "scanning" "SonarQube complete. Initializing Snyk..." "${{ steps.gitleaks.outcome }}" "${{ steps.sonar.outputs.outcome }}" "scanning" "pending" "pending"

    - name: NPM Audit Dependency Scan
      id: snyk
      run: npm audit --audit-level=high
      continue-on-error: true

    - name: Docker Build
      id: docker_build
      run: docker build -t nextjs-secure .
      continue-on-error: true

    - name: Report Post-Snyk
      if: always()
      env:
        REPORT_WEBHOOK_SECRET: ${{ secrets.REPORT_WEBHOOK_SECRET }}
        WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      run: ./report.sh "scanning" "Snyk complete. Initializing Trivy..." "${{ steps.gitleaks.outcome }}" "${{ steps.sonar.outputs.outcome }}" "${{ steps.snyk.outcome }}" "scanning" "pending"

    - name: Trivy Container Scan
      id: trivy
      if: steps.docker_build.outcome == 'success'
      # IMPORTANT: v0.28.0 was one of the tags poisoned in the March 2026
      # trivy-action supply chain attack (CVE-2026-33634). v0.35.0 was the
      # only tag confirmed never compromised; v0.36.0 is current safe latest.
      # Prefer pinning to a full commit SHA over any tag going forward —
      # tags are mutable and this is exactly how the attack worked.
      uses: aquasecurity/trivy-action@v0.36.0
      continue-on-error: true
      with:
        image-ref: nextjs-secure
        severity: CRITICAL
        exit-code: 1
        ignore-unfixed: true

    - name: Report Post-Trivy
      if: always()
      env:
        REPORT_WEBHOOK_SECRET: ${{ secrets.REPORT_WEBHOOK_SECRET }}
        WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      run: ./report.sh "scanning" "Trivy complete. Initializing Checkov..." "${{ steps.gitleaks.outcome }}" "${{ steps.sonar.outputs.outcome }}" "${{ steps.snyk.outcome }}" "${{ steps.trivy.outcome || 'skipped' }}" "scanning"

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false
              
    - name: Terraform Init
      id: tf_init
      run: |
        cd terraform
        terraform init -backend=false
      continue-on-error: true

    - name: Terraform Validate
      id: tf_validate
      run: |
        cd terraform
        terraform validate
      continue-on-error: true

    - name: Checkov Scan (IaC)
      id: checkov
      # NOTE: verify this tag actually exists on bridgecrewio/checkov-action
      # before merging — unverified at time of writing. Given the trivy
      # incident, consider pinning this to a commit SHA too.
      uses: bridgecrewio/checkov-action@v12.2926.0
      continue-on-error: true
      with:
        directory: terraform
        framework: terraform
        soft_fail: false

    - name: Determine Overall Status
      id: overall
      if: always()
      run: |
        if [ "${{ steps.gitleaks.outcome }}" = "failure" ] || \
           [ "${{ steps.sonar.outputs.outcome }}" = "failure" ] || \
           [ "${{ steps.snyk.outcome }}" = "failure" ] || \
           [ "${{ steps.docker_build.outcome }}" = "failure" ] || \
           [ "${{ steps.trivy.outcome }}" = "failure" ] || \
           [ "${{ steps.tf_init.outcome }}" = "failure" ] || \
           [ "${{ steps.tf_validate.outcome }}" = "failure" ] || \
           [ "${{ steps.checkov.outcome }}" = "failure" ]; then
          echo "status=vulnerable" >> $GITHUB_OUTPUT
        else
          echo "status=secure" >> $GITHUB_OUTPUT
        fi

    - name: Deploy to Vercel
      id: deploy
      if: steps.overall.outputs.status == 'secure'
      continue-on-error: true
      run: |
        npm install -g vercel
        vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

    - name: Report Final Status
      if: always()
      env:
        REPORT_WEBHOOK_SECRET: ${{ secrets.REPORT_WEBHOOK_SECRET }}
        WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      run: |
        DEPLOY_OUTCOME="${{ steps.deploy.outcome || 'skipped' }}"
        ./report.sh "${{ steps.overall.outputs.status }}" "Pipeline completed (deploy: $DEPLOY_OUTCOME)" "${{ steps.gitleaks.outcome }}" "${{ steps.sonar.outputs.outcome }}" "${{ steps.snyk.outcome }}" "${{ steps.trivy.outcome || 'skipped' }}" "${{ steps.checkov.outcome }}"